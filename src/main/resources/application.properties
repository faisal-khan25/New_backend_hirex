# ── Server ──────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── File uploads ────────────────────────────────────────────────
# FIX: was hardcoded to C:\Final_Projects — that fails on Render (Linux).
# Now reads from env var, falls back to home dir.
resume.upload.dir=${RESUME_UPLOAD_DIR:${user.home}/resume-uploads}
chat.upload.dir=${CHAT_UPLOAD_DIR:${user.home}/chat-uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ── Chat: Delete for Everyone ────────────────────────────────────
# Time window (in minutes) after sending within which the original
# sender may delete a message for everyone. WhatsApp-style default: 60.
chat.delete-for-everyone.window-minutes=60

# ── Compression + HTTP/2 ─────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html
server.compression.min-response-size=1024
server.http2.enabled=true