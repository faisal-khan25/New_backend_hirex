spring.datasource.username=root
spring.datasource.password=kdHdrnvnrLvBodIZpoXCocvxACYfcvea

# ── Connection pool (HikariCP) ───────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ── LOGGING FIX ─────────────────────────────────────────────────
# BEFORE: logging.level.org.springframework.security=TRACE
# That was logging 13 filter invocations per request — adding 20-80ms
# of synchronous I/O on every single HTTP call. Changed to WARN.
logging.level.org.springframework.security=WARN
logging.level.com.hirex.security=WARN
logging.level.com.hirex=INFO
# ────────────────────────────────────────────────────────────────

# ── JPA ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=2000

